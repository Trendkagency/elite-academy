[program:worker-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'while true; do php /app/artisan schedule:run >> /var/log/supervisor/scheduler.log 2>&1; sleep 60; done'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stdout_logfile=/var/log/supervisor/worker-scheduler.log
stderr_logfile=/var/log/supervisor/worker-scheduler.log

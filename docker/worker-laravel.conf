[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --queue=backup,default --sleep=3 --tries=3 --max-time=3600 --memory=512'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/supervisor/worker-laravel.log
stderr_logfile=/var/log/supervisor/worker-laravel.log

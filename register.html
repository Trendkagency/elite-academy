<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — Elite Academy</title>
  <meta name="description" content="Create a student account at Elite Academy to access free demo lessons and course tracks.">
  <link rel="alternate" hreflang="en" href="https://elite-academy.com/en/register">
  <link rel="alternate" hreflang="ar" href="https://elite-academy.com/ar/register">
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-[#FAFAF9] text-slate-900 font-sans antialiased selection:bg-teal-100 selection:text-teal-900 min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="anim-nav sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/80 shadow-2xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-[70px] lg:h-[80px] flex items-center justify-between">
      <a href="index.html" class="flex items-center group">
        <img src="images/logo.png" alt="Elite Academy Logo" class="h-[42px] md:h-[50px] lg:h-[60px] w-auto object-contain transition-transform duration-250 ease-out group-hover:scale-[1.03]">
      </a>
      <a href="index.html" class="text-xs font-semibold text-slate-600 hover:text-teal-600">
        &larr; Back to Main Site
      </a>
    </div>
  </header>

  <!-- REGISTER CONTAINER -->
  <main class="py-12 px-4 sm:px-6 lg:px-8 max-w-md mx-auto w-full my-auto">
    <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl space-y-6">
      <div class="text-center space-y-2">
        <h1 class="font-heading font-extrabold text-2xl text-slate-900">Create Student Account</h1>
        <p class="text-xs text-slate-500">Join over 25,000 students on Elite Academy</p>
      </div>

      <form action="index.html" method="GET" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Full Name</label>
          <input type="text" placeholder="e.g. Sarah Jenkins" required class="input-mobile">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Email Address</label>
          <input type="email" placeholder="student@example.com" required class="input-mobile">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Password</label>
          <input type="password" placeholder="••••••••" required class="input-mobile">
        </div>

        <button type="submit" class="btn-mobile-lg btn-lift text-white bg-teal-600 hover:bg-teal-700 shadow-md shadow-teal-600/20 touch-press">
          Create Account &rarr;
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        Already have an account? <a href="login.html" class="font-semibold text-teal-600 hover:underline" data-i18n="navbar.login">Log in</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-center text-xs">
    <p><span data-i18n="footer.rights">© 2026 Elite Academy. All rights reserved.</span></p>
  </footer>

  <!-- i18n Bilingual Engine -->
  <script src="js/i18n.js"></script>

</body>
</html>

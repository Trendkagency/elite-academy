<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" fill="none">
    <!-- EDU Demo Logo (Light Backgrounds) -->
    <defs>
        <linearGradient id="edu-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="edu-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
    </defs>
    
    <!-- Emblem -->
    <rect x="4" y="5" width="40" height="40" rx="11" fill="url(#edu-grad-primary)" />
    <!-- Graduation Cap / Diamond Emblem -->
    <path d="M24 13L35 19L24 25L13 19L24 13Z" fill="white" />
    <path d="M16 23.5V29C16 31.5 19.5 34 24 34C28.5 34 32 31.5 32 29V23.5L24 28L16 23.5Z" fill="white" fill-opacity="0.9" />
    <circle cx="34" cy="27" r="2" fill="url(#edu-grad-accent)" />
    
    <!-- Brand Text: EDU -->
    <text x="54" y="30" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="-0.5">EDU</text>
    
    <!-- Demo Pill Badge -->
    <rect x="108" y="14" width="44" height="18" rx="5" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.75" />
    <text x="115" y="27" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#b45309" letter-spacing="0.5">DEMO</text>
</svg>
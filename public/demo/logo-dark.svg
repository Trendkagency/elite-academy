    <rect x="62" y="38" width="46" height="15" rx="4" fill="#78350f" />
    <text x="68" y="49" font-family="'Cairo', system-ui, sans-serif" font-size="9" font-weight="800" fill="#fde68a" letter-spacing="0.5">DEMO V2</text>
    <text x="114" y="49" font-family="'Cairo', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">LMS Platform</text>

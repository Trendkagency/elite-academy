<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
    <!-- Elite Academy Demo Logo (Dark Backgrounds) -->
    <defs>
        <linearGradient id="grad-primary-dark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="grad-accent-dark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
    </defs>
    
    <!-- Emblem -->
    <rect x="6" y="8" width="44" height="44" rx="12" fill="url(#grad-primary-dark)" />
    <path d="M28 16L40 23V35L28 42L16 35V23L28 16Z" stroke="white" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M28 24L34 27.5V34.5L28 38L22 34.5V27.5L28 24Z" fill="url(#grad-accent-dark)" />
    
